# Machine-readable trigger for the evaluation harness.
tool: OpenTelemetry (.NET) + OTLP exporter
slug: opentelemetry
kind: sdk
status: active
target_framework: net8.0
language_version: "12.0"
runner: tools/opentelemetry/run.sh
expects:
  exit_code: 0
  reason: >-
    ActivitySource spans captured during dotnet test; reports/otel-spans.json and reports/opentelemetry.json.
metrics:
  primary_for: 1
  alternative_for: 0
